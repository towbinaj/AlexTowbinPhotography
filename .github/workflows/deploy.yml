name: Build & deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # hourly: new album photos show up within about an hour
  workflow_dispatch:        # "Run workflow" button for an immediate refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Photo titles + order (curation.json) live in a separate public repo,
      # written by the site's editor. Baked in here for JSON-LD / search; the
      # page also reads it live.
      - uses: actions/checkout@v7
        with:
          repository: towbinaj/AlexTowbinPhotographyData
          path: data
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - run: python -m pytest -q tests

      # Keep each photo's processed web images between runs (~1.7 MB a photo),
      # so only new photos are downloaded and processed. Restore the newest
      # copy; save a new one only when something changed.
      - id: rendered
        uses: actions/cache/restore@v6
        with:
          path: .cache/rendered
          key: rendered-
          restore-keys: rendered-

      # One-time bridge: before the first processed cache exists, reuse the
      # old cache of originals so the first build doesn't re-download them.
      - if: steps.rendered.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: .cache/originals
          key: originals-
          restore-keys: originals-

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          ICLOUD_ALBUM: ${{ secrets.ICLOUD_ALBUM }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build.py

      - id: rendered-key
        run: echo "key=rendered-$(cat .cache/rendered/*/entry.json 2>/dev/null | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - if: steps.rendered.outputs.cache-matched-key != steps.rendered-key.outputs.key
        uses: actions/cache/save@v6
        with:
          path: .cache/rendered
          key: ${{ steps.rendered-key.outputs.key }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
