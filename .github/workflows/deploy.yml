name: Build & deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # hourly: new album photos show up within about an hour.
  workflow_dispatch:        # "Run workflow" button for an immediate refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Photo titles + order (curation.json) live in a separate public repo,
      # written by the site's editor. Baked in here for JSON-LD / search; the
      # page also reads it live.
      - uses: actions/checkout@v4
        with:
          repository: towbinaj/AlexTowbinPhotographyData
          path: data
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - run: python -m pytest -q tests

      # Keep downloaded originals between runs so only new photos are fetched.
      # Restore the newest copy; save a new one only when the set of photos
      # changed (hourly runs would otherwise store a ~0.5 GB copy every hour).
      - id: originals
        uses: actions/cache/restore@v4
        with:
          path: .cache/originals
          key: originals-
          restore-keys: originals-

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          ICLOUD_ALBUM: ${{ secrets.ICLOUD_ALBUM }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build.py

      - id: originals-key
        run: echo "key=originals-$(ls .cache/originals 2>/dev/null | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - if: steps.originals.outputs.cache-matched-key != steps.originals-key.outputs.key
        uses: actions/cache/save@v4
        with:
          path: .cache/originals
          key: ${{ steps.originals-key.outputs.key }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
