<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23888' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23888'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" id="brand">{{TITLE}}</a>
    <nav>
      <button class="nav-link" id="about-btn" type="button" hidden>About</button>
      <a class="nav-link insta" id="insta" href="#" target="_blank" rel="noopener" hidden aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" class="dot"/></svg>
        <span id="insta-handle"></span>
      </a>
    </nav>
  </header>

  <p class="tagline" id="tagline" hidden></p>

  <section class="about" id="about" hidden>
    <div class="about-inner" id="about-text"></div>
  </section>

  <main id="gallery" class="gallery" aria-label="Photographs"></main>
  <p class="empty" id="empty" hidden>New photographs coming soon.</p>

  <footer class="site-footer">
    <span>&copy; <span id="year"></span> <span id="footer-name"></span>. All rights reserved.</span>
    <a id="footer-insta" href="#" target="_blank" rel="noopener" hidden></a>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lb-btn lb-close" id="lb-close" aria-label="Close">&times;</button>
    <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous photo">&#8249;</button>
    <figure class="lb-figure">
      <img id="lb-img" alt="">
      <figcaption id="lb-caption"></figcaption>
    </figure>
    <button class="lb-btn lb-next" id="lb-next" aria-label="Next photo">&#8250;</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
