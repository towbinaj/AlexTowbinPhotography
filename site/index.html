<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.goatcounter.com; connect-src 'self' https://raw.githubusercontent.com; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#0b0b0a">
  <meta name="author" content="{{AUTHOR}}">
  <meta name="copyright" content="{{COPYRIGHT}}">
  <meta name="rights" content="{{COPYRIGHT}}">
  <meta name="dcterms.rightsHolder" content="{{AUTHOR}}">
  <meta name="dcterms.rights" content="{{COPYRIGHT}}">
  <meta name="robots" content="index, follow, noai, noimageai">
  <link rel="license" href="{{ROOT}}about/#rights">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{ROOT}}favicon.ico" sizes="any">
  <link rel="icon" href="{{ROOT}}favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ROOT}}apple-touch-icon.png">
  <link rel="manifest" href="{{ROOT}}site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Alex Towbin">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ROOT}}style.css">
  <script type="application/ld+json">{{JSONLD}}</script>
</head>
<!-- One template, four pages (built by scripts/build.py): home, work,
     collections, about. data-pages on each section says where it appears. -->
<body data-page="{{PAGE}}" data-root="{{ROOT}}">
  <div class="grain" aria-hidden="true"></div>

  <header class="bar">
    <a class="bar-name" href="{{ROOT}}" id="bar-name"></a>
    <nav class="bar-nav">
      <a href="{{ROOT}}work/" data-nav="work">Work</a>
      <a href="{{ROOT}}collections/" data-nav="collections" id="nav-collections" hidden>Collections</a>
      <a href="{{ROOT}}about/" data-nav="about" id="nav-about">About</a>
      <a id="nav-insta" href="#" target="_blank" rel="noopener" hidden>Instagram <span class="arr">↗</span></a>
    </nav>
  </header>

  <main id="top">
    <section class="hero" aria-label="Introduction" data-pages="home">
      <div class="hero-text">
        <p class="eyebrow mono"><span class="dot"></span><span id="hero-eyebrow">Photography</span></p>
        <h1 class="hero-name" id="hero-name"></h1>
        <p class="hero-tag" id="hero-tag"></p>
        <div class="hero-foot mono">
          <a href="#work" class="scroll-cue"><span class="line"></span>Scroll to view the work</a>
          <span id="hero-count"></span>
        </div>
      </div>
      <div class="hero-media" id="hero-media">
        <div class="hero-index mono" id="hero-index"></div>
      </div>
    </section>

    <section class="work" id="work" aria-label="Photographs" data-pages="home work">
      <div class="work-head">
        <h2 class="section-title" id="work-title">Selected <em>work</em></h2>
        <a class="view-all mono" id="view-all" href="{{ROOT}}work/" data-pages="home">View all work →</a>
        <nav class="collections mono" id="collections" aria-label="Collections" hidden data-pages="work"></nav>
      </div>
      <div class="masonry" id="masonry"></div>
      <p class="empty mono" id="empty" hidden>New photographs coming soon.</p>
      <p class="more-link" data-pages="home"><a class="mono" id="view-all-2" href="{{ROOT}}work/">View all work →</a></p>
    </section>

    <section class="colls" id="colls" aria-label="Collections" data-pages="collections">
      <h2 class="section-title">Collections</h2>
      <div class="cgrid" id="cgrid"></div>
      <p class="empty mono" id="colls-empty" hidden>Collections are coming soon. <a href="{{ROOT}}work/">See all work →</a></p>
    </section>

    <section class="about" id="about" data-pages="about">
      <h2 class="section-title">About</h2>
      <div class="about-text" id="about-text"></div>
      <div class="prints" id="prints" hidden>
        <h3 class="mono label">Prints &amp; inquiries</h3>
        <p id="prints-text"></p>
      </div>
    </section>

    <section class="rights" id="rights" aria-label="Copyright" data-pages="about">
      <p class="mono label">Copyright</p>
      <div>
        <p class="rights-notice" id="rights-notice"></p>
        <p class="rights-terms" id="rights-terms"></p>
        <p class="rights-contact" id="rights-contact" hidden></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <a class="marquee" id="marquee" href="#" target="_blank" rel="noopener" aria-label="Instagram">
      <div class="marquee-track" id="marquee-track"></div>
    </a>
    <div class="footer-meta mono">
      <span id="footer-notice"></span>
      <span id="footer-updated"></span>
      <a href="#top">Back to top ↑</a>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <div class="lb-stage" id="lb-stage">
      <img id="lb-img" alt="">
    </div>
    <div class="lb-info mono" id="lb-info" hidden></div>
    <div class="lb-bar mono">
      <span class="lb-count"><span id="lb-count"></span><span class="lb-credit" id="lb-credit"></span></span>
      <span class="lb-caption" id="lb-caption"></span>
      <span class="lb-actions">
        <a id="lb-inquire" class="lb-link" href="#" hidden>Inquire</a>
        <button type="button" id="lb-share">Share</button>
        <button type="button" id="lb-prev" aria-label="Previous photo">←</button>
        <button type="button" id="lb-next" aria-label="Next photo">→</button>
        <button type="button" id="lb-close" aria-label="Close">Close</button>
      </span>
    </div>
  </div>

  <script src="{{ROOT}}titlecase.js"></script>
  <script src="{{ROOT}}meta.js"></script>
  <script src="{{ROOT}}app.js"></script>
</body>
</html>
