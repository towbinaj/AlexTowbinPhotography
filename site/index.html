<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.goatcounter.com; connect-src 'self' https://raw.githubusercontent.com; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#0b0b0a">
  <meta name="author" content="{{AUTHOR}}">
  <meta name="copyright" content="{{COPYRIGHT}}">
  <meta name="rights" content="{{COPYRIGHT}}">
  <meta name="dcterms.rightsHolder" content="{{AUTHOR}}">
  <meta name="dcterms.rights" content="{{COPYRIGHT}}">
  <meta name="robots" content="index, follow, noai, noimageai">
  <link rel="license" href="#rights">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Alex Towbin">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="application/ld+json">{{JSONLD}}</script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true"><span>View</span></div>

  <header class="bar">
    <a class="bar-name" href="#top" id="bar-name"></a>
    <nav class="bar-nav">
      <a href="#work">Work</a>
      <a href="#about" id="nav-about" hidden>About</a>
      <a id="nav-insta" href="#" target="_blank" rel="noopener" hidden>Instagram <span class="arr">↗</span></a>
    </nav>
  </header>

  <main id="top">
    <section class="hero" aria-label="Introduction">
      <div class="hero-text">
        <p class="eyebrow mono"><span class="dot"></span><span id="hero-eyebrow">Photography</span></p>
        <h1 class="hero-name" id="hero-name"></h1>
        <p class="hero-tag" id="hero-tag"></p>
        <div class="hero-foot mono">
          <a href="#work" class="scroll-cue"><span class="line"></span>Scroll to view the work</a>
          <span id="hero-count"></span>
        </div>
      </div>
      <div class="hero-media" id="hero-media">
        <div class="hero-index mono" id="hero-index"></div>
      </div>
    </section>

    <section class="work" id="work" aria-label="Photographs">
      <div class="work-head">
        <h2 class="section-title" id="work-title">Selected <em>work</em></h2>
        <nav class="collections mono" id="collections" aria-label="Collections" hidden></nav>
        <div class="view-toggle mono" role="group" aria-label="Layout">
          <button type="button" data-view="stream" aria-pressed="true">Stream</button>
          <button type="button" data-view="grid" aria-pressed="false">Index</button>
        </div>
      </div>
      <div class="masonry" id="masonry"></div>
      <p class="empty mono" id="empty" hidden>New photographs coming soon.</p>
    </section>

    <section class="about" id="about" hidden>
      <p class="mono label">About</p>
      <p class="about-text" id="about-text"></p>
    </section>

    <section class="rights" id="rights" aria-label="Copyright">
      <p class="mono label">Copyright</p>
      <div>
        <p class="rights-notice" id="rights-notice"></p>
        <p class="rights-terms" id="rights-terms"></p>
        <p class="rights-contact" id="rights-contact" hidden></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <a class="marquee" id="marquee" href="#" target="_blank" rel="noopener" aria-label="Instagram">
      <div class="marquee-track" id="marquee-track"></div>
    </a>
    <div class="footer-meta mono">
      <span id="footer-notice"></span>
      <span id="footer-updated"></span>
      <a href="#top">Back to top ↑</a>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <div class="lb-stage" id="lb-stage">
      <img id="lb-img" alt="">
    </div>
    <div class="lb-info mono" id="lb-info" hidden></div>
    <div class="lb-bar mono">
      <span class="lb-count"><span id="lb-count"></span><span class="lb-credit" id="lb-credit"></span></span>
      <span class="lb-caption" id="lb-caption"></span>
      <span class="lb-actions">
        <button type="button" id="lb-share">Share</button>
        <button type="button" id="lb-prev" aria-label="Previous photo">←</button>
        <button type="button" id="lb-next" aria-label="Next photo">→</button>
        <button type="button" id="lb-close" aria-label="Close">Close</button>
      </span>
    </div>
  </div>

  <script src="titlecase.js"></script>
  <script src="meta.js"></script>
  <script src="app.js"></script>
</body>
</html>
